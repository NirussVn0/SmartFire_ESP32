<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2874bd"/></marker></defs><rect width="1200" height="810" fill="#f8fbff"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="30" fill="#23364d" font-weight="bold">SmartFire ESP32 - bench wiring overview</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="18" fill="#23364d" font-weight="normal">Classic ESP32-WROOM only. Verify module terminal labels and polarity before power.</text><rect x="40" y="115" width="280" height="125" rx="14" fill="#fff3dd" stroke="#a7bad1"/><text x="58" y="147" font-family="Arial,sans-serif" font-size="22" fill="#23364d" font-weight="bold">12V DC adapter</text><text x="58" y="176" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">External, fused DC supply</text><text x="58" y="201" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">Never connect 12V to ESP32</text><rect x="415" y="115" width="300" height="125" rx="14" fill="#fff3dd" stroke="#a7bad1"/><text x="433" y="147" font-family="Arial,sans-serif" font-size="22" fill="#23364d" font-weight="bold">LM2596 buck</text><text x="433" y="176" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">Measure OUT = 5.0V first</text><text x="433" y="201" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">OUT- = common GND</text><rect x="810" y="115" width="330" height="125" rx="14" fill="#eaf2ff" stroke="#a7bad1"/><text x="828" y="147" font-family="Arial,sans-serif" font-size="22" fill="#23364d" font-weight="bold">MQ-2 module</text><text x="828" y="176" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">VCC = 5V, GND = common</text><text x="828" y="201" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">AO -&gt; divider, DO unused</text><path d="M320 175 L415 175" fill="none" stroke="#b77717" stroke-width="3" marker-end="url(#arrow)"/><path d="M715 175 L810 175" fill="none" stroke="#b77717" stroke-width="3" marker-end="url(#arrow)"/><rect x="810" y="310" width="330" height="155" rx="14" fill="#eaf2ff" stroke="#a7bad1"/><text x="828" y="342" font-family="Arial,sans-serif" font-size="22" fill="#23364d" font-weight="bold">ADC divider</text><text x="828" y="371" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">AO -&gt; 10k -&gt; ADC point</text><text x="828" y="396" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">ADC point -&gt; 10k -&gt; GND</text><text x="828" y="421" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">ADC point -&gt; GPIO34</text><text x="828" y="446" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">5V AO gives about 2.5V ADC</text><path d="M975 240 L975 310" fill="none" stroke="#2874bd" stroke-width="3" marker-end="url(#arrow)"/><rect x="415" y="335" width="300" height="190" rx="14" fill="#eaf2ff" stroke="#a7bad1"/><text x="433" y="367" font-family="Arial,sans-serif" font-size="22" fill="#23364d" font-weight="bold">ESP32 DevKit</text><text x="433" y="396" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">GPIO34: divided MQ-2 AO</text><text x="433" y="421" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">GPIO27: Flame DO &lt;=3.3V</text><text x="433" y="446" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">GPIO18: button to GND</text><text x="433" y="471" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">GPIO25: 330 ohm + LED</text><text x="433" y="496" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">GPIO26: D4184 logic only</text><path d="M810 385 L715 385" fill="none" stroke="#2874bd" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="310" width="280" height="125" rx="14" fill="#eaf2ff" stroke="#a7bad1"/><text x="58" y="342" font-family="Arial,sans-serif" font-size="22" fill="#23364d" font-weight="bold">Flame module</text><text x="58" y="371" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">Use 3.3V only if supported</text><text x="58" y="396" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">Confirm DO voltage + polarity</text><path d="M320 385 L415 410" fill="none" stroke="#2874bd" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="510" width="280" height="115" rx="14" fill="#eaf2ff" stroke="#a7bad1"/><text x="58" y="542" font-family="Arial,sans-serif" font-size="22" fill="#23364d" font-weight="bold">Test / Silence button</text><text x="58" y="571" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">GPIO18 &lt;-&gt; switch &lt;-&gt; GND</text><text x="58" y="596" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">Internal pull-up enabled</text><path d="M320 560 L415 465" fill="none" stroke="#2874bd" stroke-width="3" marker-end="url(#arrow)"/><rect x="810" y="530" width="330" height="135" rx="14" fill="#eaf2ff" stroke="#a7bad1"/><text x="828" y="562" font-family="Arial,sans-serif" font-size="22" fill="#23364d" font-weight="bold">D4184 + 12V horn</text><text x="828" y="591" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">Verify 3.3V trigger + terminals</text><text x="828" y="616" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">Use separate 12V load branch</text><text x="828" y="641" font-family="Arial,sans-serif" font-size="17" fill="#23364d" font-weight="normal">Hardware pull resistor = OFF</text><path d="M715 490 L810 580" fill="none" stroke="#2874bd" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="705" font-family="Arial,sans-serif" font-size="20" fill="#23364d" font-weight="bold">COMMON GND: ESP32, MQ-2, flame and compatible non-isolated driver.</text><text x="40" y="739" font-family="Arial,sans-serif" font-size="18" fill="#23364d" font-weight="normal">Flash on USB with external supply disconnected. Do not backfeed the PC USB port.</text><text x="40" y="771" font-family="Arial,sans-serif" font-size="18" fill="#a04520" font-weight="normal">Default firmware: horn disabled; MQ-2 not commissioned. Read the full wiring guide.</text><path d="M565 240 L565 335" fill="none" stroke="#b77717" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="286" font-family="Arial,sans-serif" font-size="16" fill="#23364d">5V input*</text><text x="580" y="310" font-family="Arial,sans-serif" font-size="14" fill="#23364d">*verify board</text></svg>