[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM10
monitor_port = COM10
upload_speed = 460800
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra
board_build.partitions = min_spiffs.csv
; Target: ORIGINAL ESP32-WROOM DevKit (typical CH340, 30 pins), NOT C3/S3/C6.
; CH340 detected on COM9; update port if Windows assigns another COM number.
